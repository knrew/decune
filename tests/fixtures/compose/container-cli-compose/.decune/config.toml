version = 1
shell = "/bin/sh"

[[ports]]
service = "app"
container = 4321
host = __PRIMARY_HOST_PORT__
label = "primary"

[[ports]]
service = "worker"
container = 5432
host = __SIDECAR_HOST_PORT__
label = "worker"

[ports.auto]
enabled = false

[container.cli]
enabled = true

[credentials.git]
enabled = false

[credentials.github]
enabled = false
