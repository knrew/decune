services:
  app:
    image: alpine:3.20
    container_name: fixed-app-388
    command: sleep infinity
    ipc: shareable
    environment:
      AGENT_ENDPOINT: http://10.223.0.1:9000
    networks:
      - appnet
    ports:
      - 127.0.0.1:18080:80
    volumes:
      - cache:/cache
      - ..:/workspace

  namespace-ref:
    image: alpine:3.20
    command: sleep infinity
    depends_on:
      - app
    network_mode: container:fixed-app-388
    ipc: container:fixed-app-388
    pid: container:fixed-app-388
    volumes_from:
      - container:fixed-app-388:ro

  link-ref:
    image: alpine:3.20
    command: sleep infinity
    depends_on:
      - app
    external_links:
      - fixed-app-388:app-link
    networks:
      - appnet

networks:
  appnet:
    name: fixed-network-388
    ipam:
      config:
        - subnet: 10.223.0.0/24
          gateway: 10.223.0.1
          ip_range: 10.223.0.128/25
          aux_addresses:
            reserved: 10.223.0.10

volumes:
  cache:
    name: fixed-cache-388
