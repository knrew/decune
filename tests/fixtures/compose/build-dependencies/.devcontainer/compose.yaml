services:
  base:
    image: ${DECUNE_BUILD_DEPS_BASE_IMAGE:?DECUNE_BUILD_DEPS_BASE_IMAGE is required}
    build:
      context: .
      dockerfile: Dockerfile.base
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    depends_on:
      - base
    command: sleep infinity
    volumes:
      - ..:/workspace
