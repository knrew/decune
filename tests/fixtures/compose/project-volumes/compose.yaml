services:
  app:
    image: alpine:3.20
    command: sleep infinity
    volumes:
      - ..:/workspace
      - data:/data
      - shared-external:/shared
      - /anonymous
volumes:
  data: {}
  shared-external:
    external: true
    name: __EXTERNAL_VOLUME__
  unused-external:
    external: true
    name: __UNUSED_EXTERNAL_VOLUME__
