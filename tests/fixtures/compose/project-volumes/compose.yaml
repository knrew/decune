services:
  app:
    image: alpine:3.20
    command: sleep infinity
    volumes:
      - ..:/workspace
      # __PROJECT_VOLUME_MOUNTS__
      - shared-external:/shared
      - /anonymous
volumes:
  # __PROJECT_VOLUME_DECLARATIONS__
  shared-external:
    external: true
    name: __EXTERNAL_VOLUME__
  unused-external:
    external: true
    name: __UNUSED_EXTERNAL_VOLUME__
