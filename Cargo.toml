[package]
categories             = ["command-line-utilities", "development-tools"]
description            = "Run Dev Container configurations from a standalone Rust CLI."
edition.workspace      = true
keywords               = ["cli", "compose", "devcontainer", "docker"]
license.workspace      = true
name                   = "decune"
publish.workspace      = true
readme                 = "README.md"
repository.workspace   = true
rust-version.workspace = true
version.workspace      = true

[lints]
workspace = true

[workspace]
members = [
  ".",
  "crates/decune-container-protocol",
  "crates/decune-container-tools",
  "xtask",
]
resolver = "3"

[workspace.package]
edition      = "2024"
license      = "MIT"
publish      = false
repository   = "https://github.com/knrew/decune"
rust-version = "1.97"
version      = "0.3.4"

# Blank lines are intentional: taplo sorts keys within each block, and the
# blocks keep explicit lint choices near their Clippy group.
[workspace.lints.clippy]
all = {level = "deny", priority = -1}

cargo = {level = "deny", priority = -1}

# Explicit cargo overrides.
multiple_crate_versions = "warn"

pedantic = {level = "deny", priority = -1}

# Explicit pedantic overrides.
single_char_pattern = "allow"
unreadable_literal  = "allow"

nursery = {level = "warn", priority = -1}

# Explicit nursery overrides.
large_stack_frames         = "deny"
missing_const_for_fn       = "deny"
needless_collect           = "deny"
non_send_fields_in_send_ty = "deny"
option_if_let_else         = "deny"
or_fun_call                = "deny"
redundant_clone            = "deny"
use_self                   = "deny"

restriction = {level = "allow", priority = -1}

# Restriction is allow-by-default; only selected lints are explicit here.
allow_attributes                = "warn"
allow_attributes_without_reason = "deny"
arbitrary_source_item_ordering  = "allow"
clone_on_ref_ptr                = "deny"
cognitive_complexity            = "deny"
create_dir                      = "deny"
dbg_macro                       = "deny"
disallowed_methods              = "deny"
exit                            = "deny"
expect_used                     = "deny"
filetype_is_file                = "deny"
get_unwrap                      = "deny"
large_include_file              = "deny"
let_underscore_must_use         = "deny"
let_underscore_untyped          = "deny"
map_err_ignore                  = "deny"
min_ident_chars                 = "allow"
mod_module_files                = "deny"
multiple_unsafe_ops_per_block   = "warn"
non_ascii_literal               = "warn"
panic                           = "deny"
panic_in_result_fn              = "deny"
pub_without_shorthand           = "deny"
rc_buffer                       = "warn"
rc_mutex                        = "deny"
string_slice                    = "deny"
tests_outside_test_module       = "deny"
todo                            = "warn"
undocumented_unsafe_blocks      = "deny"
unimplemented                   = "warn"
unreachable                     = "allow"
unused_result_ok                = "deny"
unwrap_in_result                = "deny"
unwrap_used                     = "deny"
verbose_file_reads              = "deny"
wildcard_enum_match_arm         = "deny"

[profile.dist]
codegen-units = 1
inherits      = "release"
lto           = "thin"
strip         = "symbols"

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
clap = {features = ["derive"], version = "4.6.1"}
console = "0.16.3"
decune-container-protocol = {path = "crates/decune-container-protocol"}
flate2 = "1.1.5"
futures-util = "0.3.32"
indicatif = "0.18.4"
libc = "0.2.186"
reqwest = {default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
], version = "0.12.24"}
serde = {features = ["derive"], version = "1.0.228"}
serde_json = "1.0.150"
sha2 = "0.11.0"
tar = "0.4.46"
tempfile = "3.27.0"
tokio = {features = [
  "io-std",
  "io-util",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
], version = "1.52.3"}
toml = "1.1.2"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
proptest   = "1.11.0"
rstest     = "0.26.1"
tokio      = {features = ["test-util"], version = "1.52.3"}

[build-dependencies]
anyhow     = "1.0.102"
serde      = {features = ["derive"], version = "1.0.228"}
serde_json = "1.0.150"
sha2       = "0.11.0"
