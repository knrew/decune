[package]
authors     = ["knrew"]
description = ""
edition     = "2024"
license     = "MIT"
name        = "decune"
publish     = false
version     = "0.1.0"

[workspace]
members  = [".", "crates/decune-container-protocol", "crates/decune-container-tools"]
resolver = "3"

[dependencies]
anyhow = "1.0.102"
bollard = "0.21.0"
clap = {features = ["derive"], version = "4.6.1"}
decune-container-protocol = {path = "crates/decune-container-protocol"}
futures-util = "0.3.32"
libc = "0.2.186"
serde = {features = ["derive"], version = "1.0.228"}
serde_json = "1.0.149"
sha2 = "0.11.0"
tokio = {features = [
  "io-std",
  "io-util",
  "net",
  "rt-multi-thread",
  "signal",
], version = "1.52.3"}
toml = "1.1.2"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
proptest   = "1.11.0"
rstest     = "0.26.1"
tempfile   = "3.27.0"
