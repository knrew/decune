[package]
authors     = ["knrew"]
description = ""
edition     = "2024"
license     = "MIT"
name        = "decune"
publish     = false
repository  = "https://github.com/knrew/decune"
version     = "0.1.0"

[workspace]
members = [
  ".",
  "crates/decune-container-protocol",
  "crates/decune-container-tools",
  "xtask",
]
resolver = "3"

[profile.dist]
codegen-units = 1
inherits      = "release"
lto           = "thin"
strip         = "symbols"

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
clap = {features = ["derive"], version = "4.6.1"}
decune-container-protocol = {path = "crates/decune-container-protocol"}
flate2 = "1.1.5"
futures-util = "0.3.32"
libc = "0.2.186"
reqwest = {default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
], version = "0.12.24"}
serde = {features = ["derive"], version = "1.0.228"}
serde_json = "1.0.150"
sha2 = "0.11.0"
tar = "0.4.46"
tokio = {features = [
  "io-std",
  "io-util",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
], version = "1.52.3"}
toml = "1.1.2"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
proptest   = "1.11.0"
rstest     = "0.26.1"
tempfile   = "3.27.0"

[build-dependencies]
anyhow     = "1.0.102"
serde      = {features = ["derive"], version = "1.0.228"}
serde_json = "1.0.150"
sha2       = "0.11.0"
