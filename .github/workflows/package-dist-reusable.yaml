name: Package Dist

on:
  workflow_call:
    inputs:
      version:
        description: Version to use in dist archive names and manifests
        required: true
        type: string
      checkout-ref:
        description: Git ref to check out before packaging
        required: false
        type: string
      artifact-name:
        description: Name of the final GitHub Actions artifact
        required: false
        default: dist-assets
        type: string

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  container-tools:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs['checkout-ref'] || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - name: Build container tools bundle
        run: cargo run -p xtask -- build-container-tools --out target/decune-dist/container-tools-bundle --locked
      - name: Check container tools bundle
        run: cargo run -p xtask -- check-container-tools --dir target/decune-dist/container-tools-bundle
      - name: Pack container tools bundle
        run: tar -C target/decune-dist -czf target/decune-dist/container-tools-bundle.tar.gz container-tools-bundle
      - uses: actions/upload-artifact@v6
        with:
          if-no-files-found: error
          name: container-tools-bundle
          path: target/decune-dist/container-tools-bundle.tar.gz
          retention-days: 3

  build:
    needs: container-tools
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs['checkout-ref'] || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux musl linker
        if: startsWith(matrix.target, 'x86_64-unknown-linux-musl') || startsWith(matrix.target, 'aarch64-unknown-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: actions/download-artifact@v8
        with:
          name: container-tools-bundle
          path: target/decune-dist
      - name: Unpack container tools bundle
        run: tar -C target/decune-dist -xzf target/decune-dist/container-tools-bundle.tar.gz
      - name: Build and package
        env:
          DECUNE_CONTAINER_TOOLS_BUNDLE: required
          DECUNE_CONTAINER_TOOLS_BUNDLE_DIR: ${{ github.workspace }}/target/decune-dist/container-tools-bundle
        run: |
          cargo run -p xtask -- dist \
            --target "${{ matrix.target }}" \
            --version "${{ inputs.version }}" \
            --locked
      - uses: actions/upload-artifact@v6
        with:
          if-no-files-found: error
          name: dist-${{ matrix.target }}
          path: target/dist/*
          retention-days: 3

  assemble:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs['checkout-ref'] || github.ref }}
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: target/dist-parts
          pattern: dist-*
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare dist assets
        run: |
          mkdir -p target/dist
          find target/dist-parts -maxdepth 2 -type f -print -exec cp '{}' target/dist/ ';'
          cargo run -p xtask -- checksum --dist-dir target/dist
          cargo run -p xtask -- release-manifest \
            --dist-dir target/dist \
            --version "${{ inputs.version }}"
      - uses: actions/upload-artifact@v6
        with:
          if-no-files-found: error
          name: ${{ inputs['artifact-name'] }}
          path: target/dist/*
          retention-days: 3
