name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
  schedule:
    - cron: 0 0 1 * *
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  taplo:
    name: taplo
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check TOML formatting
        uses: docker://docker.io/tamasfe/taplo:0.10.0
        with:
          args: fmt --check --diff

  yamllint:
    name: yamllint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      YAMLLINT_VERSION: 1.38.0
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Install yamllint
        run: python -m pip install "yamllint==${YAMLLINT_VERSION}"
      - name: Check YAML formatting
        run: yamllint -f github .

  shellcheck-and-shfmt:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: >-
        8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
      SHFMT_VERSION: v3.13.1
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25
      - name: Install ShellCheck
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          archive="${RUNNER_TEMP}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL \
            -o "${archive}" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          printf '%s  %s\n' "${SHELLCHECK_SHA256}" "${archive}" | sha256sum -c -
          tar -xJ -C "${RUNNER_TEMP}" -f "${archive}"
          cp "${RUNNER_TEMP}/shellcheck-${SHELLCHECK_VERSION}/shellcheck" "${RUNNER_TEMP}/bin/shellcheck"
          chmod +x "${RUNNER_TEMP}/bin/shellcheck"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - name: Install shfmt
        run: |
          go install "mvdan.cc/sh/v3/cmd/shfmt@${SHFMT_VERSION}"
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
      - name: Run sh/bash lint
        run: ./.github/scripts/lint_sh.sh

  cargo-fmt:
    name: cargo-fmt
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cargo fmt
        run: cargo fmt --all --check --verbose

  cargo-clippy:
    name: cargo-clippy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cargo clippy
        run: cargo clippy --workspace --all-features -- -D warnings

  cargo-check:
    name: cargo-check (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: debug
          - profile: release
            release_flag: --release
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo check
        run: cargo check ${{ matrix.release_flag }} --workspace --all-targets --all-features --verbose

  cargo-test:
    name: cargo-test (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: debug
          - profile: release
            release_flag: --release
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - name: Check Docker daemon
        run: docker version
      - name: Build container tools
        run: scripts/build-container-tools.sh linux-amd64 linux-arm64
      - name: Cargo test
        env:
          DECUNE_CONTAINER_TOOLS_DIR: ${{ github.workspace }}/target/container-tools
        run: cargo test ${{ matrix.release_flag }} --workspace --all-features --no-fail-fast --verbose
