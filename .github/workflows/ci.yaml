name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
  schedule:
    - cron: 0 0 1 * *
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  taplo:
    name: taplo
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check TOML formatting
        uses: docker://docker.io/tamasfe/taplo:0.10.0
        with:
          args: fmt --check --diff

  yamllint:
    name: yamllint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      YAMLLINT_VERSION: 1.38.0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Install yamllint
        run: python -m pip install "yamllint==${YAMLLINT_VERSION}"
      - name: Check YAML formatting
        run: yamllint -f github .

  shell-lint:
    name: shell-lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      SHELLCHECK_VERSION: 0.11.0
      SHFMT_VERSION: 3.13.1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install ShellCheck
        run: |
          curl -fsSL \
            -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          tar -C /tmp -xf /tmp/shellcheck.tar.xz
          sudo install -m 0755 "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
      - name: Install shfmt
        run: |
          curl -fsSL \
            -o /tmp/shfmt \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          sudo install -m 0755 /tmp/shfmt /usr/local/bin/shfmt
      - name: Check shell scripts
        run: bash .github/scripts/lint-sh-bash.sh

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check Markdown formatting
        uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          config: .markdownlint.yaml
          globs: "**/*.md"

  cargo-fmt:
    name: cargo-fmt
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cargo fmt
        run: cargo fmt --all --check --verbose

  cargo-clippy:
    name: cargo-clippy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cargo clippy
        run: cargo clippy --workspace --all-features --all-targets

  cargo-check:
    name: cargo-check (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: debug
          - profile: release
            release_flag: --release
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo check
        run: cargo check ${{ matrix.release_flag }} --workspace --all-targets --all-features --verbose

  cargo-test:
    name: cargo-test (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: debug
          - profile: release
            release_flag: --release
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - name: Check Docker daemon
        run: docker version
      - name: Cargo test
        run: cargo run --locked -p xtask -- workspace-test ${{ matrix.release_flag }}

  compose-integration:
    name: compose-integration (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: debug
          - profile: release
            release_flag: --release
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - name: Check Docker daemon
        run: docker version
      - name: Check Docker Compose v2 plugin
        run: docker compose version
      - name: Cargo Compose integration test
        run: cargo run --locked -p xtask -- compose-integration ${{ matrix.release_flag }}

  package-dist:
    name: package-dist
    permissions:
      contents: read
    uses: ./.github/workflows/package-dist-reusable.yaml
    with:
      artifact-name: dist-assets
      verify-display-version: false
      version: 0.0.0-dev
