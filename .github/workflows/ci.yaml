name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
  schedule:
    - cron: 0 0 1 * *
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  taplo:
    name: taplo
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check TOML formatting
        uses: docker://docker.io/tamasfe/taplo:0.10.0
        with:
          args: fmt --check --diff

  yamllint:
    name: yamllint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      YAMLLINT_VERSION: 1.38.0
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Install yamllint
        run: python -m pip install "yamllint==${YAMLLINT_VERSION}"
      - name: Check YAML formatting
        run: yamllint -f github .

  cargo-fmt:
    name: cargo-fmt
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cargo fmt
        run: cargo fmt --all --check --verbose

  cargo-clippy:
    name: cargo-clippy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cargo clippy
        run: cargo clippy --workspace --all-features -- -D warnings

  cargo-check:
    name: cargo-check (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: debug
          - profile: release
            release_flag: --release
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo check
        run: cargo check ${{ matrix.release_flag }} --workspace --all-targets --all-features --verbose

  cargo-test:
    name: cargo-test (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: debug
          - profile: release
            release_flag: --release
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Docker daemon
        run: docker version
      - name: Cargo test
        run: cargo test ${{ matrix.release_flag }} --workspace --all-features --no-fail-fast --verbose
