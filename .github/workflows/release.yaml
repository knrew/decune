name: Release

on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build
        required: true
        type: string
      publish:
        description: Create GitHub Release
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
            git fetch --tags origin "$tag"
            git checkout "$tag"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          version="${tag#v}"
          cargo run -p xtask -- release-preflight --tag "$tag" --version "$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  container-tools:
    needs: preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - name: Build container tools bundle
        run: cargo run -p xtask -- build-container-tools --out target/decune-dist/container-tools-bundle --locked
      - name: Check container tools bundle
        run: cargo run -p xtask -- check-container-tools --dir target/decune-dist/container-tools-bundle
      - name: Pack container tools bundle
        run: tar -C target/decune-dist -czf target/decune-dist/container-tools-bundle.tar.gz container-tools-bundle
      - uses: actions/upload-artifact@v6
        with:
          if-no-files-found: error
          name: container-tools-bundle
          path: target/decune-dist/container-tools-bundle.tar.gz

  build:
    needs:
      - preflight
      - container-tools
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux musl linker
        if: startsWith(matrix.target, 'x86_64-unknown-linux-musl') || startsWith(matrix.target, 'aarch64-unknown-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: actions/download-artifact@v8
        with:
          name: container-tools-bundle
          path: target/decune-dist
      - name: Unpack container tools bundle
        run: tar -C target/decune-dist -xzf target/decune-dist/container-tools-bundle.tar.gz
      - name: Build and package
        env:
          DECUNE_CONTAINER_TOOLS_BUNDLE: required
          DECUNE_CONTAINER_TOOLS_BUNDLE_DIR: ${{ github.workspace }}/target/decune-dist/container-tools-bundle
        run: |
          cargo run -p xtask -- dist \
            --target "${{ matrix.target }}" \
            --version "${{ needs.preflight.outputs.version }}" \
            --locked
      - uses: actions/upload-artifact@v6
        with:
          if-no-files-found: error
          name: dist-${{ matrix.target }}
          path: dist/*

  publish:
    needs:
      - preflight
      - build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist-parts
          pattern: dist-*
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare release assets
        run: |
          mkdir -p dist
          find dist-parts -maxdepth 2 -type f -print -exec cp '{}' dist/ ';'
          cargo run -p xtask -- checksum --dist-dir dist
          cargo run -p xtask -- release-manifest \
            --dist-dir dist \
            --version "${{ needs.preflight.outputs.version }}"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.preflight.outputs.tag }}" dist/* \
            --verify-tag \
            --title "${{ needs.preflight.outputs.tag }}" \
            --notes-from-tag
