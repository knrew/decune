name: Rust

on:
  push:
    branches:
      - master
      - main
  pull_request:
  schedule:
    - cron: 0 0 1 * *
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cargo fmt
        run: cargo fmt --all --check --verbose

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cargo clippy
        run: cargo clippy --workspace --all-features -- -D warnings

  check:
    name: check (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: debug
            command: cargo check --workspace --all-targets --all-features --verbose
          - profile: release
            command: cargo check --release --workspace --all-targets --all-features --verbose
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo check
        run: ${{ matrix.command }}

  test:
    name: test (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: debug
            command: cargo test --workspace --all-features --no-fail-fast --verbose
          - profile: release
            command: cargo test --release --workspace --all-features --no-fail-fast --verbose
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo test
        run: ${{ matrix.command }}

  docker-integration:
    name: Docker integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Docker daemon
        run: docker version
      - name: Cargo test with Docker
        env:
          DECUNE_DOCKER_TESTS: "1"
        run: cargo test --workspace --all-features --no-fail-fast --verbose
